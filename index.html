    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f0f;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .gallery-container {
            display: grid;

            grid-template-columns: repeat(3, minmax(0, 1fr));

            grid-template-areas:
                "gif1 gif2 gif3"
                ". banner .";

            gap: 25px;

            width: 100%;
            max-width: 1100px;
            margin: 0 auto;

            align-items: start;
        }

        /* VIDEO CARD */

        .video-card {
            position: relative;
            display: block;

            width: 100%;
            aspect-ratio: 16 / 9;

            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 8px 24px rgba(0,0,0,0.5);

            background-color: #222;
            cursor: pointer;
        }

        /* GIF POSITIONS */

        .gif-1 {
            grid-area: gif1;
        }

        .gif-2 {
            grid-area: gif2;
        }

        .gif-3 {
            grid-area: gif3;
        }

        /* THUMBNAIL */

        .video-thumbnail {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition:
                transform 0.4s ease,
                filter 0.4s ease;
        }

        /* PLAY OVERLAY */

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.2);

            transition: background 0.3s ease;
        }

        /* PLAY BUTTON */

        .play-button {
            width: 65px;
            height: 65px;

            background: rgba(255, 255, 255, 0.9);

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0 4px 15px rgba(0,0,0,0.3);

            transition:
                transform 0.3s ease,
                background-color 0.3s ease;
        }

        /* PLAY ICON */

        .play-icon {
            width: 0;
            height: 0;

            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #111;

            margin-left: 5px;
        }

        /* HOVER EFFECTS */

        .video-card:hover .video-thumbnail {
            transform: scale(1.05);
            filter: brightness(0.85);
        }

        .video-card:hover .play-overlay {
            background: rgba(0, 0, 0, 0.4);
        }

        .video-card:hover .play-button {
            transform: scale(1.15);
            background: #ff0000;
        }

        .video-card:hover .play-icon {
            border-left-color: #fff;
        }

        /* BANNER AD CONTAINER */

        .banner-ad-container {
            grid-area: banner;

            width: 100%;
            max-width: 728px;

            min-height: 90px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto;

            overflow: hidden;
        }

        /* TABLET AND MOBILE LAYOUT */

        @media (max-width: 768px) {

            .gallery-container {
                grid-template-columns: 1fr;

                grid-template-areas:
                    "gif1"
                    "gif2"
                    "banner"
                    "gif3";

                max-width: 550px;
                gap: 22px;
            }

            .banner-ad-container {
                max-width: 100%;
            }
        }

        /* SMALL MOBILE */

        @media (max-width: 400px) {

            body {
                padding: 12px;
            }

            .gallery-container {
                gap: 18px;
            }

            .play-button {
                width: 55px;
                height: 55px;
            }
        }

    </style>
